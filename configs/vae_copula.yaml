# VAE + Copula configuration

defaults:
  - default

model:
  name: "vae_copula"
  rnn_type: "lstm"            # "gru" or "lstm"
  hidden_dim: 128             # encoder and decoder RNN hidden size
  num_layers: 2               # encoder and decoder RNN layers
  latent_dim: 32
  dropout: 0.1
  # "gaussian": decoder predicts mean + variance per step and generation samples
  # from it (needed for return-like data); "mse"/"mae": legacy mean-only decoder.
  reconstruction_loss: "gaussian"
  ar_noise: true              # AR(1) observation noise with learned per-feature persistence
  # Innovations: "student_t" (learned df per feature) gives realistic within-window
  # fat tails; garch_noise adds GARCH(1,1) volatility feedback so extremes cluster
  # instead of appearing as isolated spikes. On AAPL (3 seeds) this pair matched
  # real tails best while keeping volatility clustering; "gaussian" has thin tails,
  # and student_t without GARCH loses clustering. At matched sample size its largest
  # moves are calibrated (median 1.03x the real maximum; Gaussian only 0.79x).
  noise_distribution: "student_t"
  garch_noise: true
  # Couple each feature's noise to the size of the return shock (learned per
  # feature), so big moves come with high volume. On AAPL (3 seeds) the same-day
  # corr(volume, |r|) went 0.11 -> 0.40 (real 0.46), validation NLL 0.303 -> 0.273,
  # stylized score 0.723 -> 0.770; but TSTR AUC fell 0.540 -> 0.503, significantly
  # in 2 of 3 seeds (z ~3), so AAPL realism is lower with coupling (0.787 vs 0.830).
  # On MSFT and JPM the coupled model scores higher overall. See README.
  magnitude_coupling: true
  # Correlate the features' same-day noise (learned correlation matrix). Without it
  # the noise is independent across features and same-day co-movement is lost:
  # corr(return, overnight gap) is +0.67 in real AAPL data but was ~0.00 in samples,
  # and a post-hoc LSTM told synthetic windows from real ones with AUC ~0.98. On
  # AAPL (3 seeds) it gives return-gap corr +0.49, LSTM AUC 0.80 (real held-out
  # windows score 0.84), validation NLL 0.273 -> 0.221, and stylized score
  # 0.770 -> 0.803 (trimmed kurtosis 6.19 -> 4.45, real 4.68). LSTM AUC also falls
  # on MSFT (0.97 -> 0.66) and JPM (0.97 -> 0.69), but tails and crash regimes thin
  # there: JPM trimmed kurtosis 11.7 -> 5.6 (real 9.8). See README.
  correlated_noise: true
  # Condition the decoder on each window's volatility regime (log realized return
  # volatility); generation reuses the regime of the training window it samples.
  # With correlated noise alone the latent under-encodes the regime and crash
  # windows are written off as day-level outliers, which thins tails (JPM trimmed
  # kurtosis 5.6, real 9.8). With it (and noise_calibration_steps below): JPM 9.2,
  # MSFT 5.4 (real 5.45), AAPL 4.8 (real 4.7). The likelihood is then conditional
  # on the regime. The checkpoint stores one regime value per training window.
  regime_conditioning: true
  # Model the candle wicks (HighRange, LowRange: >= 0, heavily skewed) after a
  # Box-Cox transform with this lambda, instead of as symmetric noise around a mean
  # near 0. Before, 11-13% of generated wicks were clipped to exactly 0 (real ~2%);
  # with it 3-4.5%, wick tails match real, and the window discriminator score rises
  # (AAPL 0.65 -> 0.88, JPM 0.80 -> 0.94, MSFT 0.79 -> 0.96). The maximum-likelihood
  # lambda (~0.1-0.2, near a log) over-corrects: symmetric noise on that scale gives
  # wicks up to thousands of times the median. See README.
  wick_transform: true
  wick_lambda: 0.4
  # Feed the volatility regime straight into the output heads as well as the RNN.
  # With compressed wicks the shared RNN state carried less crash-level signal, and
  # JPM's crash-window return volatility fell to ~0.83 of realized (trimmed kurtosis
  # 8.4 -> 6.2); with this it is 8.2 (real 9.8).
  regime_to_heads: true

  # Latent copula, fitted to draws from the encoder's posteriors after training;
  # used when generation.latent_sampler is "copula".
  copula:
    type: "gaussian"          # "gaussian" or "student_t"
    df: 4                     # degrees of freedom for the Student-t copula

training:
  epochs: 300
  lr: 1.0e-3
  lr_scheduler: "reduce_on_plateau"
  lr_scheduler_patience: 20
  lr_scheduler_factor: 0.5
  batch_size: 128
  gradient_clip: 1.0

  # ELBO weights
  kl_weight: 1.0              # beta (1.0 = standard VAE)
  kl_annealing: true          # ramp beta from 0 to kl_weight
  kl_annealing_epochs: 50
  # After training, fit the cross-feature noise parameters (noise mixing and
  # magnitude couplings) to convergence with the network frozen. Early stopping
  # leaves them short of their optimum: on AAPL the volume coupling stopped at
  # ~0.35-0.45 while the residuals support ~0.56, so the same-day volume-volatility
  # link was too weak (0.35 vs 0.46 real; 0.46 after). 0 disables.
  noise_calibration_steps: 300

generation:
  num_samples: 1000
  # Latent sampler: "posterior" samples the training windows' encoder posteriors
  # (aggregate posterior), reproducing rare regimes such as crash-level volatility
  # at their real frequency; "copula" (Gaussian fit, smooths them away) or "prior".
  # Note: "posterior" stores each training window's posterior in the checkpoint.
  latent_sampler: "posterior"
  temperature: 1.0            # latent spread multiplier
