# TimeGAN configuration (Yoon et al., NeurIPS 2019)

defaults:
  - default

model:
  name: "timegan"
  hidden_dim: 24       # RNN hidden size, also the latent (embedding) dimension
  num_layers: 3
  noise_dim: 24        # generator noise dimension
  rnn_type: "gru"      # "gru" or "lstm"
  dropout: 0.0

training:
  # Phase 1: Autoencoder pretraining
  autoencoder_epochs: 200
  autoencoder_lr: 1.0e-3

  # Phase 2: Supervisor pretraining
  supervisor_epochs: 200
  supervisor_lr: 1.0e-3

  # Phase 3: Joint adversarial training
  joint_epochs: 300
  generator_lr: 1.0e-4
  discriminator_lr: 1.0e-4
  joint_lr: 1.0e-4     # embedder/recovery learning rate during joint training

  # Loss weights
  lambda_e: 10.0       # embedder reconstruction loss weight
  lambda_s: 10.0       # generator supervised-loss weight
  gamma: 1.0           # weight of adversarial terms on the raw generator output

  batch_size: 128
  gradient_clip: 1.0

generation:
  num_samples: 1000
