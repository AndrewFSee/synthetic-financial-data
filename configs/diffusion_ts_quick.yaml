# Quick Diffusion-TS run for a fast-but-honest end-to-end demo on real data.
# Inherits the full Diffusion-TS config; only the training length is reduced so
# it finishes in a few minutes on CPU. (Checkpoints store their own architecture,
# so any settings here round-trip through synfin-generate.)

defaults:
  - diffusion_ts

training:
  epochs: 60
  warmup_steps: 200
  # Small batches give more optimizer updates for the same compute. On AAPL
  # (150 epochs) batch 32 vs 128 raised realism 0.865 -> 0.888 and the
  # discriminative score 0.534 -> 0.719 (tails stayed thin either way).
  batch_size: 32
