# Default configuration shared across all models.
# Model configs pull this in via `defaults: [default]` and override keys.

data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
  start_date: "2015-01-01"
  end_date: "2024-12-31"
  interval: "1d"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  synthetic_dir: "data/synthetic"

  # "returns": stationary features (LogReturn, OpenGap, HighRange, LowRange,
  #            LogVolumeRel) that map back to valid OHLCV bars. Recommended.
  # "levels":  legacy raw price/volume levels (trend with the price; models
  #            mostly learn the training period's price level).
  feature_set: "returns"
  # features: [...]          # optional explicit column list (overrides feature_set)
  volume_window: 20          # baseline window for LogVolumeRel

  # Optional scale-free technical indicators appended as extra features
  # (RSI/100, MACD_Hist/Close, Bollinger band width, ATR/Close).
  use_rsi: false
  use_macd: false
  use_bollinger: false
  use_atr: false

  # Preprocessing. Rows are split chronologically first; the scaler is fit on
  # training rows only.
  normalization: "zscore"    # "zscore" or "minmax"
  window_size: 30
  train_ratio: 0.7
  val_ratio: 0.15            # test = 1 - train - val

training:
  seed: 42
  device: "auto"             # "auto", "cpu", "cuda", "mps"
  batch_size: 64
  num_workers: 0             # DataLoader workers (0 = main process; fastest on Windows)
  log_interval: 10           # log every N epochs
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true

evaluation:
  output_dir: "reports"
  ks_alpha: 0.05             # significance level for KS reject flags
  mmd_bandwidth: null        # RBF bandwidth; null = median heuristic
  tstr_task: "volatility"    # "volatility" (next-step |r| above median) or "direction"
