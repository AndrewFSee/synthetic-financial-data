# Diffusion Model (DDPM with a 1-D U-Net denoiser)
# For a Transformer denoiser use the Diffusion-TS model (configs/diffusion_ts.yaml).

defaults:
  - default

model:
  name: "diffusion"

  # Noise schedule
  noise_schedule: "cosine"   # "linear" or "cosine"
  num_timesteps: 1000
  beta_start: 1.0e-4         # linear schedule only
  beta_end: 0.02             # linear schedule only

  # Network target: "v" (velocity) or "eps" (noise). With "eps" the clean signal is
  # recovered by dividing by sqrt(alpha_bar_t), which near t = T amplifies errors
  # 30x-20,000x under the cosine schedule (samples ~2.7x too dispersed on AAPL,
  # ancestral sampling diverged). "v" avoids that division.
  prediction: "v"

  # U-Net denoiser (input channels come from the data). Sized for ~1-2k training
  # windows: the former [64, 128, 256, 128, 64] x2 (1.7M params) overfit badly
  # on AAPL (validation loss best at epoch 20 of 150); this one has ~118k.
  unet:
    hidden_dims: [32, 64, 64, 32]
    time_embed_dim: 64
    num_res_blocks: 1
    dropout: 0.1
    group_norm_groups: 8

training:
  epochs: 500
  lr: 2.0e-4
  lr_scheduler: "cosine"     # "cosine" (with warm-up), "reduce_on_plateau" or "none"
  warmup_steps: 1000
  batch_size: 128
  gradient_clip: 1.0
  ema_decay: 0.9999          # EMA of weights used for validation and sampling

generation:
  sampler: "ddim"            # "ddpm" or "ddim"
  ddim_steps: 50
  num_samples: 1000
