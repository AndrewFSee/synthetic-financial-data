# Diffusion Model (DDPM with a 1-D U-Net denoiser)
# For a Transformer denoiser use the Diffusion-TS model (configs/diffusion_ts.yaml).

defaults:
  - default

model:
  name: "diffusion"

  # Noise schedule
  noise_schedule: "cosine"   # "linear" or "cosine"
  num_timesteps: 1000
  beta_start: 1.0e-4         # linear schedule only
  beta_end: 0.02             # linear schedule only

  # U-Net denoiser (input channels come from the data)
  unet:
    hidden_dims: [64, 128, 256, 128, 64]
    time_embed_dim: 128
    num_res_blocks: 2
    dropout: 0.1
    group_norm_groups: 8

training:
  epochs: 500
  lr: 2.0e-4
  lr_scheduler: "cosine"     # "cosine" (with warm-up), "reduce_on_plateau" or "none"
  warmup_steps: 1000
  batch_size: 128
  gradient_clip: 1.0
  ema_decay: 0.9999          # EMA of weights used for validation and sampling

generation:
  sampler: "ddim"            # "ddpm" or "ddim"
  ddim_steps: 50
  num_samples: 1000
